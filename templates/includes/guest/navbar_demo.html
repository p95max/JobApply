{% load i18n %}

<div class="app-navigation__primary">
  <a class="app-nav-link {% if request.path == '/dashboard/' %}is-active{% endif %}" href="{% url 'dashboard' %}"><span aria-hidden="true">⌂</span><span>{% trans "Dashboard" %}</span></a>
  <a class="app-nav-link {% if request.path|slice:':14' == '/applications/' %}is-active{% endif %}" href="{% url 'applications:list' %}"><span aria-hidden="true">📋</span><span>{% trans "Applications" %}</span></a>
  <a class="app-nav-link {% if request.path|slice:':12' == '/interviews/' %}is-active{% endif %}" href="{% url 'interviews:list' %}"><span aria-hidden="true">🗓️</span><span>{% trans "Interviews" %}</span></a>
  <a class="app-nav-link app-nav-link--preview {% if '/gmail_stats/' in request.path %}is-active{% endif %}" href="{% url 'gmail_assistant:gmail_assistant' %}" title="{% trans 'Demo preview — sign in with Google to connect Gmail' %}"><span aria-hidden="true">✨</span><span>{% trans "Gmail Assistant" %}</span></a>
  <a class="app-nav-link app-nav-link--preview {% if '/reports/' in request.path %}is-active{% endif %}" href="{% url 'reports:statistics' %}" title="{% trans 'Demo preview — sign in with Google to unlock reports and backups' %}"><span aria-hidden="true">📊</span><span>{% trans "Reports" %}</span></a>
</div>

<div class="app-navigation__actions">
  <form method="post" action="{% url 'accounts:start_full_login' %}" class="app-full-access-form">
    {% csrf_token %}
    <button class="app-signin-action" type="submit">{% trans "Sign in with Google" %}</button>
  </form>
  <button
    class="app-theme-switch"
    type="button"
    data-theme-toggle
    data-light-label="{% trans 'Switch to light theme' %}"
    data-dark-label="{% trans 'Switch to dark theme' %}"
    title="{% trans 'Switch to light theme' %}"
    aria-label="{% trans 'Switch to light theme' %}"
  ><span class="app-theme-switch__icon" data-theme-icon aria-hidden="true">☀️</span></button>
  <form action="{% url 'set_language' %}" method="post" class="app-language-form">
    {% csrf_token %}<input name="next" type="hidden" value="{{ request.get_full_path }}">
    <button type="submit" name="language" value="{% if LANGUAGE_CODE == 'de' %}en{% else %}de{% endif %}" class="app-language-switch" title="{% if LANGUAGE_CODE == 'de' %}{% trans 'Switch to English' %}{% else %}{% trans 'Switch to German' %}{% endif %}" aria-label="{% if LANGUAGE_CODE == 'de' %}{% trans 'Switch to English' %}{% else %}{% trans 'Switch to German' %}{% endif %}">
      {% if LANGUAGE_CODE == 'de' %}
        <img class="app-language-switch__flag" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f1ec-1f1e7.svg" alt="">
      {% else %}
        <img class="app-language-switch__flag" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f1e9-1f1ea.svg" alt="">
      {% endif %}
    </button>
  </form>
  <a class="app-demo-leave" href="/accounts/logout/" title="{% trans 'Leave demo' %}" aria-label="{% trans 'Leave demo' %}">↗</a>
</div>
