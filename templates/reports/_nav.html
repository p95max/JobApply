{% load i18n %}

<div class="mb-4">

  <div class="mb-2">
    <h1 class="h4 mb-1">{% trans "Services" %}</h1>
    <div class="text-muted small">
      {% trans "Stats/Gmail stats, export & import, cloud backups" %}
    </div>
  </div>

  <ul class="nav nav-tabs services-tabs border-0">
    <li class="nav-item">
      <a class="nav-link {% if request.resolver_match.url_name == 'statistics' %}active{% endif %}"
         href="{% url 'reports:statistics' %}">
        📊 <span class="ms-1">{% trans "Stats" %}</span>
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link {% if request.resolver_match.url_name == 'gmail_dashboard' %}active{% endif %}"
         href="{% url 'gmail_stats:gmail_dashboard' %}">
        📬 <span class="ms-1">{% trans "Gmail stats" %}</span>
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link {% if request.resolver_match.url_name == 'gmail_assistant' or request.resolver_match.url_name == 'gmail_proposals' or request.resolver_match.url_name == 'gmail_proposal_detail' %}active{% endif %}"
         href="{% url 'gmail_stats:gmail_assistant' %}">
        🤖 <span class="ms-1">{% trans "Gmail Assistant" %}</span>
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link {% if request.resolver_match.url_name == 'import' %}active{% endif %}"
         href="{% url 'reports:import' %}">
        ⬆ <span class="ms-1">{% trans "Import/Export" %}</span>
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link {% if request.resolver_match.url_name == 'drive_backups' %}active{% endif %}"
         href="{% url 'reports:drive_backups' %}">
        ☁ <span class="ms-1">{% trans "Cloud backups" %}</span>
      </a>
    </li>
  </ul>

</div>
